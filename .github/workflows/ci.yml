name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm vitest run

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        env:
          PUBLIC_AUTH_URL: http://localhost:4321
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    # The e2e suite used to run against a local Supabase stack in Docker. The database is
    # now hosted Neon, so there is no local stack to spin up — these tests need a real
    # DATABASE_URL. To avoid every PR writing to a live database, this job is gated to
    # manual runs (`workflow_dispatch`) and requires a DATABASE_URL secret pointing at a
    # throwaway/branch database. Lint, typecheck and unit tests still run on every push/PR.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Check DATABASE_URL is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set — the e2e suite needs a Neon database." >&2
            exit 1
          fi

      - name: Run e2e tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:4321
          PUBLIC_AUTH_URL: http://localhost:4321
        run: pnpm test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
