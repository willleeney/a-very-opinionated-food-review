name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        # Only PUBLIC_* vars belong here — they are inlined into the client bundle.
        # Server secrets (DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL,
        # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET) are set as Cloudflare Worker
        # secrets via `wrangler secret put` and must never be baked into the build.
        env:
          PUBLIC_AUTH_URL: ${{ secrets.PUBLIC_AUTH_URL }}
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9681c2997648301493e78cacbfb790a9f19c833f # v3.9.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/web
          # Must match the wrangler devDependency in packages/web/package.json.
          # Otherwise the action decides the local copy is the wrong version and
          # runs `npm i wrangler` inside the workspace package, which fails:
          # npm cannot parse pnpm's `workspace:*` protocol (EUNSUPPORTEDPROTOCOL).
          wranglerVersion: '4.59.2'
          packageManager: pnpm
