<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Bite mask - top right bite -->
    <clipPath id="bite">
      <path d="M0,0 H512 V512 H0 Z M420,90 a65,65 0 1,0 -1,0 Z"/>
    </clipPath>
    <!-- Sesame seed shape -->
    <ellipse id="seed" rx="8" ry="5" fill="#f5f0e0" opacity="0.9" transform="rotate(-30)"/>
    <!-- Subtle shadow filter -->
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g clip-path="url(#bite)" filter="url(#shadow)">
    <!-- ═══ Bottom bun ═══ -->
    <ellipse cx="256" cy="340" rx="175" ry="45" fill="#d4863a"/>
    <ellipse cx="256" cy="335" rx="175" ry="42" fill="#e09540"/>
    <!-- Bun bottom highlight -->
    <ellipse cx="256" cy="332" rx="160" ry="35" fill="#e8a14d" opacity="0.4"/>

    <!-- ═══ Patty ═══ -->
    <ellipse cx="256" cy="298" rx="168" ry="32" fill="#5c2e0e"/>
    <ellipse cx="256" cy="294" rx="168" ry="30" fill="#6b3610"/>
    <!-- Patty grill marks -->
    <line x1="120" y1="290" x2="200" y2="288" stroke="#4a2108" stroke-width="2.5" opacity="0.4"/>
    <line x1="170" y1="298" x2="260" y2="296" stroke="#4a2108" stroke-width="2.5" opacity="0.4"/>
    <line x1="250" y1="290" x2="350" y2="288" stroke="#4a2108" stroke-width="2.5" opacity="0.4"/>
    <line x1="310" y1="298" x2="390" y2="296" stroke="#4a2108" stroke-width="2.5" opacity="0.4"/>

    <!-- ═══ Cheese ═══ -->
    <!-- Melty cheese draped over patty -->
    <path d="M95,275 Q120,268 160,270 Q200,262 256,264 Q310,262 350,270 Q390,268 420,275 L425,285 Q400,292 370,288 Q360,298 340,300 Q310,290 256,288 Q200,290 170,300 Q150,298 140,288 Q120,292 95,285 Z" fill="#ffcc33"/>
    <!-- Cheese highlight -->
    <path d="M120,272 Q200,264 256,266 Q310,264 380,272 L375,278 Q310,270 256,272 Q200,270 125,278 Z" fill="#ffd84d" opacity="0.6"/>

    <!-- ═══ Lettuce ═══ -->
    <path d="M88,262 Q130,248 170,256 Q210,244 256,250 Q300,244 340,256 Q380,248 424,262 L420,272 Q380,258 340,266 Q300,254 256,260 Q210,254 170,266 Q130,258 92,272 Z" fill="#4a9e3f"/>
    <!-- Lettuce ruffles -->
    <path d="M92,268 Q110,260 130,264 Q150,256 170,262 Q190,254 210,260 Q230,252 256,258 Q280,252 300,260 Q320,254 340,262 Q360,256 380,264 Q400,260 420,268" fill="none" stroke="#3d8535" stroke-width="2.5" opacity="0.5"/>

    <!-- ═══ Tomato slices ═══ -->
    <ellipse cx="200" cy="248" rx="52" ry="12" fill="#d63030" transform="rotate(-3, 200, 248)"/>
    <ellipse cx="200" cy="246" rx="48" ry="10" fill="#e04040" transform="rotate(-3, 200, 246)"/>
    <ellipse cx="320" cy="250" rx="48" ry="11" fill="#d63030" transform="rotate(4, 320, 250)"/>
    <ellipse cx="320" cy="248" rx="44" ry="9" fill="#e04040" transform="rotate(4, 320, 248)"/>

    <!-- ═══ Onion rings ═══ -->
    <ellipse cx="256" cy="238" rx="30" ry="8" fill="none" stroke="#e8d8f0" stroke-width="3" opacity="0.7"/>
    <ellipse cx="190" cy="240" rx="22" ry="6" fill="none" stroke="#e8d8f0" stroke-width="2.5" opacity="0.5" transform="rotate(-10, 190, 240)"/>
    <ellipse cx="330" cy="240" rx="25" ry="7" fill="none" stroke="#e8d8f0" stroke-width="2.5" opacity="0.5" transform="rotate(8, 330, 240)"/>

    <!-- ═══ Top bun ═══ -->
    <path d="M81,238 Q82,168 160,135 Q200,118 256,115 Q312,118 352,135 Q430,168 431,238 Z" fill="#d4863a"/>
    <!-- Bun dome highlight -->
    <path d="M105,230 Q108,175 175,148 Q210,132 256,130 Q302,132 337,148 Q404,175 407,230 Z" fill="#e09540"/>
    <!-- Top highlight -->
    <path d="M150,185 Q200,145 256,142 Q312,145 362,185 Q310,155 256,152 Q202,155 150,185 Z" fill="#eaad5a" opacity="0.5"/>

    <!-- ═══ Sesame seeds ═══ -->
    <use href="#seed" x="200" y="155"/>
    <use href="#seed" x="240" y="142" transform="rotate(15, 240, 142)"/>
    <use href="#seed" x="280" y="148" transform="rotate(-20, 280, 148)"/>
    <use href="#seed" x="310" y="162" transform="rotate(25, 310, 162)"/>
    <use href="#seed" x="170" y="170" transform="rotate(-10, 170, 170)"/>
    <use href="#seed" x="220" y="168" transform="rotate(40, 220, 168)"/>
    <use href="#seed" x="340" y="178" transform="rotate(-35, 340, 178)"/>
    <use href="#seed" x="260" y="160" transform="rotate(5, 260, 160)"/>
    <use href="#seed" x="150" y="190" transform="rotate(20, 150, 190)"/>
    <use href="#seed" x="295" y="175" transform="rotate(-15, 295, 175)"/>
  </g>

  <!-- ═══ Bite interior (visible through the bite hole) ═══ -->
  <g>
    <!-- Cross section visible in bite -->
    <circle cx="420" cy="90" r="65" fill="#e09540"/>
    <!-- Bun interior -->
    <path d="M370,60 Q390,40 420,35 Q450,40 470,60 Q475,70 475,85 L365,85 Q365,70 370,60 Z" fill="#f0c878"/>
    <!-- Lettuce cross section -->
    <rect x="362" y="85" width="116" height="5" rx="2" fill="#4a9e3f"/>
    <!-- Tomato cross section -->
    <rect x="365" y="90" width="110" height="6" rx="3" fill="#e04040"/>
    <!-- Cheese cross section -->
    <rect x="363" y="96" width="114" height="4" rx="2" fill="#ffcc33"/>
    <!-- Patty cross section -->
    <rect x="360" y="100" width="120" height="18" rx="3" fill="#6b3610"/>
    <!-- Bottom bun cross section -->
    <path d="M358,118 L482,118 Q480,140 460,148 Q440,155 420,155 Q400,155 380,148 Q360,140 358,118 Z" fill="#f0c878"/>
    <!-- Clip to circle -->
    <circle cx="420" cy="90" r="65" fill="none" stroke="#faf8f5" stroke-width="4"/>
  </g>
</svg>
